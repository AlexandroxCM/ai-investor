[project]
name = "ai-investor"
version = "0.1.0"
description = "Modular multi-agent AI investment platform (Phase 1: architecture skeleton)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "pyyaml>=6.0", "requests>=2.31",
    "yfinance>=0.2.40", "feedparser>=6.0", "apscheduler>=3.10"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
